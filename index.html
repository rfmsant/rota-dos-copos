<script>

/* ---------- SCORING (computed, never stored) ---------- */
function seedOrder(id){let h=2166136261;for(const ch of id)h=Math.imul(h^ch.charCodeAt(0),16777619);const a=BINGO.map((_,i)=>i);for(let i=a.length-1;i>0;i--){h=Math.imul(h^(h>>>13),1274126177)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function doneSet(id){const p=players[id]||{},s=new Set(Object.keys(p.bingo||{}).map(Number));events.forEach(e=>{if(e.k==='group'&&(e.to||[]).includes(id))s.add(e.cell)});return s}
function baseScore(id){
  const p=players[id]||{},cups=p.cups||0,water=Math.min(p.water||0,cups),done=doneSet(id),order=seedOrder(id);
  let bingo=0;done.forEach(i=>bingo+=BINGO[i][3]);
  const lines=LINES.filter(L=>L.every(pos=>done.has(order[pos]))).length;
  const full=done.size===16;
  let extra=0;events.forEach(e=>{if(e.k!=='group'&&(e.to||[]).includes(id))extra+=e.pts||0});
  const b=bingo+lines*5+(full?15:0);
  return{cups,water,bingo:b,extra,lines,cells:done.size,total:cups+water+b+extra};
}
function score(id){const b=baseScore(id),r=players[id]?.rival;const rb=r&&players[r]&&b.total>baseScore(r).total?5:0;return{...b,rival:rb,extra:b.extra+rb,total:b.total+rb}}
const plist=()=>Object.keys(players).map(id=>({id,...players[id],s:score(id)})).sort((a,b)=>b.s.total-a.s.total);
const nm=id=>esc(players[id]?.name||'?');

  $('#main').innerHTML=`<div class="sec stack"><div class="h2">Cartas desafio</div>${(()=>{const k=flashKey();if(flashDone(k))return '';const F=CARDS[flashIdx(k)];return `<div class="deal" style="border:4px solid var(--gold)"><span class="k">⚡ Relâmpago · vale o dobro (+${F[2]*2}) · até às ${new Date().getHours()}:59</span><h3>${F[0]}</h3><p>${F[1]}</p></div><button class="btn gold full" onclick="flashWin()">⚡ Escolher vencedor(es)</button>`})()}
  <p class="sub">Uma carta de cada vez para o grupo todo, ao vivo em todos os telemóveis. Quem lança a carta escolhe o vencedor.</p>
  ${c?`<div class="deal"><span class="k">Lançada por ${nm(c.by)} · +${C[2]} pts</span><h3>${C[0]}</h3><p>${C[1]}</p></div>
   ${c.by===ME||Date.now()-c.t>300000?`<button class="btn gold full" onclick="winCard()">🏅 Escolher vencedor(es)</button><button class="btn ghost full" onclick="Store.setCard(null)">Cancelar carta</button>`:`<p class="sub" style="text-align:center">À espera que ${nm(c.by)} escolha o vencedor…</p>`}`
  :`<button class="back" style="width:100%" onclick="draw()"><div><div class="f">🃏</div><div style="font:700 20px Fraunces;margin-top:8px">Lançar uma carta</div><div class="sub">Aparece no telemóvel de todos</div></div></button>`}
  <div class="card"><div class="rule"><span>Ganhar uma carta</span><b>+2 a +3</b></div><div class="rule"><span>Ganhar um duelo do bingo a alguém</span><b>+2</b></div><div class="rule"><span>Poderes de linha</span><b>±3</b></div><p class="sub" style="margin-top:6px">Tudo isto conta na coluna 🃏 Desafios do ranking.</p></div></div>`;
}
function draw(){const recent=events.filter(e=>e.k==='card').slice(0,6).map(e=>e.ci);let pool=CARDS.map((_,i)=>i).filter(i=>!recent.includes(i));const i=pool[Math.floor(Math.random()*pool.length)];Store.setCard({open:true,i,by:ME,t:Date.now()})}
function winCard(){const C=CARDS[card.i],ci=card.i;pick({html:`<div class="hd"><div class="em">🏅</div><h3>${C[0]}</h3></div>`,lbl:'Quem ganhou?',cta:`Dar +${C[2]}`,cb:ids=>{Store.addEvent({k:'card',ci,to:ids,pts:C[2],msg:`🃏 ${ids.map(nm).join(', ')} ganhou "${C[0]}"`});Store.setCard(null);closeM();confetti(80)}})}



/* ---------- EXTRAS: banners, fotos, caderno, rival, relâmpago, partilhar ---------- */
let photos=[],seenEv=null,banTimer;
function banner(em,txt){let b=$('#ban');if(!b){b=document.createElement('div');b.id='ban';document.body.appendChild(b)}
  b.innerHTML=`<div class="be">${em}</div><div>${txt}</div>`;b.classList.add('show');clearTimeout(banTimer);banTimer=setTimeout(()=>b.classList.remove('show'),3800);try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}}
function onEvents(){const ids=new Set(events.map(e=>e.id));
  if(seenEv){events.filter(e=>!seenEv.has(e.id)&&e.by!==ME&&e.msg).slice(0,2).forEach(e=>{const em={steal:'🗡️',power:'🎯',card:'🃏',duel:'⚔️',flash:'⚡',group:'👥'}[e.k]||'🍷';banner(em,e.msg)})}
  seenEv=ids}
function shrink(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const m=720,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=rej;im.src=URL.createObjectURL(file)})}
const photoField=`<label class="phl">📷 Juntar foto (opcional)<input type="file" accept="image/*" id="ph" onchange="this.parentNode.firstChild.textContent=this.files[0]?'📷 Foto pronta ✓ ':'📷 Juntar foto (opcional)'"></label>`;
async function savePhoto(file,cell){if(!file)return;try{const img=await shrink(file);if(DB)await DB.collection('photos').add({by:ME,cell,t:Date.now(),img});else{photos.unshift({id:String(Date.now()),by:ME,cell,t:Date.now(),img})}toast('📷 Foto na galeria');render()}catch(e){toast('Não deu para guardar a foto')}}
function gallery(){if(!photos.length)return '';return `<div class="card"><div style="font:700 17px Fraunces;margin-bottom:8px">📸 Galeria da rota</div><div class="gal">${photos.slice(0,30).map((p,i)=>`<button onclick="showPh(${i})"><img src="${p.img}" alt=""></button>`).join('')}</div></div>`}
function showPh(i){const p=photos[i];openM(`<img src="${p.img}" style="width:100%;border-radius:16px"><p style="text-align:center">${nm(p.by)}${p.cell!=null&&BINGO[p.cell]?' · '+BINGO[p.cell][0]+' '+BINGO[p.cell][1]:''}</p><button class="btn full" style="margin-top:10px" onclick="closeM()">Fechar</button>`)}
/* caderno */
function wineAdd(){let st=4;openM(`<div class="hd"><div class="em">📓</div><h3>Guardar vinho</h3><p>Para saberes o que comprar depois.</p></div>
  <div class="field"><label>Produtor</label><input id="wp" maxlength="40" placeholder="Quinta…"></div><div class="field"><label>Vinho</label><input id="wv" maxlength="40" placeholder="Nome / ano"></div>
  <div class="field"><label>Preço (opcional)</label><input id="wpr" maxlength="10" inputmode="decimal" placeholder="€"></div>
  <div class="field"><label>Nota</label><div class="stars" id="ws">${[1,2,3,4,5].map(n=>`<button data-n="${n}">★</button>`).join('')}</div></div>
  <button class="btn gold full" style="margin-top:14px" id="wok">Guardar</button>`);
  const paint=()=>document.querySelectorAll('#ws button').forEach(b=>b.classList.toggle('on',+b.dataset.n<=st));paint();
  document.querySelectorAll('#ws button').forEach(b=>b.onclick=()=>{st=+b.dataset.n;paint()});
  $('#wok').onclick=()=>{const w={p:$('#wp').value.trim(),v:$('#wv').value.trim(),pr:$('#wpr').value.trim(),s:st,t:Date.now()};if(!w.p&&!w.v)return toast('Escreve o produtor ou o vinho');
    Store.savePlayer({...players[ME],wines:[w,...(players[ME].wines||[])].slice(0,60)});closeM();toast('📓 Guardado')}}
function wineDel(t){Store.savePlayer({...players[ME],wines:(players[ME].wines||[]).filter(w=>w.t!==t)})}
function wineList(id,del){const ws=(players[id]?.wines||[]).slice().sort((a,b)=>b.s-a.s);if(!ws.length)return '<p class="sub">Ainda sem vinhos guardados.</p>';
  return ws.map(w=>`<div class="rk"><div class="n">${esc(w.v||'—')}<small>${esc(w.p||'')}${w.pr?' · '+esc(w.pr)+'€':''}</small></div><span style="color:var(--gold);letter-spacing:-1px">${'★'.repeat(w.s)}</span>${del?`<button class="undo" style="position:static" onclick="wineDel(${w.t})">✕</button>`:''}</div>`).join('')}
/* rival */
function rivalPick(){pick({html:'<div class="hd"><div class="em">⚔️</div><h3>Escolhe o teu rival</h3><p>Se acabares à frente dele (sem contar este bónus), ganhas <b style="color:var(--gold)">+5</b>.</p></div>',max:1,exclude:[ME],cta:'É este',cb:r=>{Store.savePlayer({...players[ME],rival:r[0]});closeM();Store.addEvent({k:'rival',to:[],pts:0,msg:`⚔️ ${nm(ME)} escolheu ${nm(r[0])} como rival`})}})}
/* relâmpago */
const flashKey=()=>{const d=new Date();return d.toISOString().slice(0,10)+'-'+d.getHours()};
const flashIdx=k=>{let h=7;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return h%(CARDS.length-1)};
const flashDone=k=>events.some(e=>e.k==='flash'&&e.key===k);
function flashWin(){const k=flashKey(),C=CARDS[flashIdx(k)];pick({html:`<div class="hd"><div class="em">⚡</div><h3>${C[0]}</h3></div>`,lbl:'Quem ganhou?',cta:`Dar +${C[2]*2}`,cb:ids=>{Store.addEvent({k:'flash',key:k,to:ids,pts:C[2]*2,msg:`⚡ ${ids.map(nm).join(', ')} ganhou o relâmpago "${C[0]}"`});closeM();confetti(90)}})}
let lastFlash=null;
setInterval(()=>{if(!authed||!players[ME]||(ENDST&&ENDST.on))return;const k=flashKey();if(k!==lastFlash){const first=lastFlash===null;lastFlash=k;if(!flashDone(k)&&!first){banner('⚡','Novo desafio relâmpago! Vale o dobro. Vai às Cartas.');render()}}},20000);
/* partilhar */
async function shareResult(){const L=plist(),c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  x.fillStyle='#1C0910';x.fillRect(0,0,1080,1350);x.fillStyle='#6E1230';x.fillRect(60,60,960,360);
  x.textAlign='center';x.fillStyle='#D9B44A';x.font='800 30px Inter, sans-serif';x.fillText('ESSÊNCIA DO VINHO · LISBOA 2026',540,130);
  x.fillStyle='#F4E9DC';x.font='900 92px Georgia, serif';x.fillText('Rota dos Copos',540,240);
  if(L[0]){x.font='700 52px Inter, sans-serif';x.fillStyle='#D9B44A';x.fillText('🏆 '+L[0].name+' · '+L[0].s.total+' pts',540,360)}
  L.slice(0,8).forEach((p,i)=>{const y=520+i*92;x.fillStyle=i===0?'#D9B44A':'#2A1018';x.fillRect(100,y-62,880,80);x.fillStyle=i===0?'#2A1018':'#F4E9DC';x.textAlign='left';x.font='800 44px Inter, sans-serif';x.fillText((i+1)+'.  '+p.e+'  '+p.name,130,y-6);x.textAlign='right';x.fillText(p.s.total+'',950,y-6)});
  x.textAlign='center';x.fillStyle='#B89AA2';x.font='600 32px Inter, sans-serif';const tot=L.reduce((a,p)=>a+p.s.cups,0);x.fillText(tot+' copos · '+L.length+' jogadores · rfmsant.github.io/rota-dos-copos',540,1290);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const f=new File([blob],'rota-dos-copos.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Rota dos Copos'});return}}catch(e){if(e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);openM(`<img src="${u}" style="width:100%;border-radius:12px"><p style="text-align:center">Mantém o dedo na imagem para guardar.</p><a class="btn gold full" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${u}" download="rota-dos-copos.png">Descarregar</a>`)}

/* ---------- FIM DA ROTA ---------- */
let peek=false,finalShown=false;
function endAsk(){openM(`<div class="hd"><div class="em">🏁</div><h3>Terminar a rota?</h3><p>Todos os telemóveis passam para o pódio final. Dá para reabrir se for engano.</p></div><div class="stack"><button class="btn gold full" onclick="closeM();peek=false;Store.setEnd({on:true,by:ME,t:Date.now()})">Terminar e ver o pódio</button><button class="btn ghost full" onclick="closeM()">Ainda não</button></div>`)}
function finale(L){
  $('#nav').innerHTML='';
  const s=x=>x.s,tot=L.reduce((a,p)=>a+p.s.cups,0),wat=L.reduce((a,p)=>a+(p.water||0),0),cards=events.filter(e=>e.k==='card').length,duels=events.filter(e=>e.k==='duel').length,lines=L.reduce((a,p)=>a+p.s.lines,0);
  const by=f=>L.slice().sort((a,b)=>f(b)-f(a))[0];const pod=[L[1],L[0],L[2]],h=[86,118,66],c=['#C9C9C9','#D9B44A','#C98A4B'],lab=['2','1','3'];
  const w=L[0];
  $('#main').innerHTML=`<div class="sec stack" style="text-align:center">
  <div class="pass" style="text-align:center"><small style="font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:800">FIM DA ROTA · ${new Date(ENDST.t).toTimeString().slice(0,5)}</small>
   <div style="margin:14px auto 6px;display:flex;justify-content:center">${w?av(w,84):''}</div><h2>${w?esc(w.name):'—'}</h2><p class="sub" style="color:var(--cream)">Campeão da Rota dos Copos com <b style="color:var(--gold)">${w?w.s.total:0} pontos</b></p></div>
  <div class="card"><div class="podium">${pod.map((p,i)=>p?`<div class="pod">${av(p,i===1?56:44)}<div class="nm">${esc(p.name)}</div><div class="ps">${p.s.total}</div><div class="blk" style="height:${h[i]}px;background:${c[i]}">${lab[i]}</div></div>`:'<div class="pod"></div>').join('')}</div></div>
  <div class="bd" style="margin:0"><div><b>${tot}</b><span>🍷 COPOS</span></div><div><b>${wat}</b><span>💧 ÁGUAS</span></div><div><b>${cards}</b><span>🃏 CARTAS</span></div><div><b>${lines}</b><span>🎯 LINHAS</span></div></div>
  ${L.length?`<div class="awards" style="text-align:left"><div class="aw2"><div class="e">🧽</div><div class="l">Esponja do dia</div><div class="v">${esc(by(p=>p.s.cups).name)}</div></div><div class="aw2"><div class="e">💧</div><div class="l">Camelo hidratado</div><div class="v">${esc(by(p=>p.water||0).name)}</div></div><div class="aw2"><div class="e">🎯</div><div class="l">Rei do bingo</div><div class="v">${esc(by(p=>p.s.cells).name)}</div></div><div class="aw2"><div class="e">🃏</div><div class="l">Desafiador</div><div class="v">${esc(by(p=>p.s.extra).name)}</div></div></div>`:''}
  <div class="card" style="text-align:left">${L.map((p,i)=>`<div class="rk"><span class="p">${i+1}</span>${av(p,34)}<div class="n">${esc(p.name)}<small>${p.s.cups} 🍷 · ${p.s.water} 💧 · ${p.s.bingo} 🎯 · ${p.s.extra} 🃏</small></div><span class="s">${p.s.total}</span></div>`).join('')}</div>
  <p class="sub">${duels} duelos · ${L.length} jogadores · Essência do Vinho 2026</p>
  <button class="btn gold full" onclick="shareResult()">📤 Partilhar resultado</button>
  ${gallery()}
  <div class="card" style="text-align:left"><div style="font:700 17px Fraunces;margin-bottom:4px">📓 Os teus vinhos para comprar</div>${wineList(ME,false)}</div>
  <button class="btn ghost full" onclick="peek=true;tab='ranking';render()">Ver a app</button>
  <button class="btn ghost full" onclick="Store.setEnd({on:false,t:Date.now()})">Reabrir a rota</button></div>`;
  if(!finalShown){finalShown=true;scrollTo(0,0);setTimeout(()=>confetti(300),200)}
}
/* ---------- RANKING ---------- */
function glass(level,w=132,h=200){
  const y=20+150*(1-level);
  return `<svg viewBox="0 0 132 200" style="flex:0 0 ${w}px;height:${h}px"><defs><clipPath id="bw${w}"><path d="M18 14 H114 C114 90 100 160 66 164 C32 160 18 90 18 14Z"/></clipPath></defs>
  <g clip-path="url(#bw${w})"><rect width="132" height="200" fill="#2A1018"/><g transform="translate(0,${y.toFixed(1)})"><path class="wv" d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 T150 6 T180 6 T210 6 V220 H0Z" fill="#9E1F45"/></g>
  <rect x="28" y="22" width="8" height="70" rx="4" fill="#F4E9DC" opacity=".12"/></g>
  <path d="M18 14 H114 C114 90 100 160 66 164 C32 160 18 90 18 14Z" fill="none" stroke="#F4E9DC" stroke-width="3"/><rect x="63" y="164" width="6" height="22" fill="#F4E9DC"/><rect x="38" y="184" width="56" height="6" rx="3" fill="#F4E9DC"/></svg>`;
}
function ranking(me,L){
  const total=L.reduce((a,p)=>a+p.s.cups,0),water=L.reduce((a,p)=>a+(p.water||0),0),goal=Math.max(L.length,1)*10,lv=Math.min(total/goal,1);
  const st=[...STAGES].reverse().find(x=>lv>=x[0])[1],nx=STAGES.find(x=>x[0]>lv);
  const pod=[L[1],L[0],L[2]],h=[86,118,66],c=['#C9C9C9','#D9B44A','#C98A4B'],lab=['2','1','3'];
  const by=f=>L.slice().sort((a,b)=>f(b)-f(a))[0];
  $('#main').innerHTML=`<div class="sec stack">
  <div class="card"><div class="baro">${glass(lv)}<div class="lvl"><div class="sub" style="font-weight:800">COPO DO GRUPO</div><div class="n">${total}<span> / ${goal}</span></div><div class="stage">${st}</div>
   <div class="ticks">${nx?`Faltam <b>${Math.ceil(nx[0]*goal-total)}</b> copos para<br><b>${nx[1]}</b>`:'<b>Meta cumprida!</b>'}</div>
   <div style="margin-top:10px;font-size:12px;font-weight:700;color:var(--water)">💧 ${water} águas no grupo</div><div class="wbar"><i style="width:${total?Math.min(water/total*100,100):0}%"></i></div></div></div></div>
  <div class="card"><div class="podium">${pod.map((p,i)=>p?`<div class="pod">${av(p,i===1?56:44)}<div class="nm">${esc(p.name)}</div><div class="ps">${p.s.total}</div><div class="blk" style="height:${h[i]}px;background:${c[i]}">${lab[i]}</div></div>`:'<div class="pod"></div>').join('')}</div></div>
  <div class="card"><div class="rule" style="font-size:11px;color:var(--muted);font-weight:800"><span>JOGADOR</span><span>🍷 · 💧 · 🎯 · 🃏 = TOTAL</span></div>
   ${L.map((p,i)=>`<div class="rk"><span class="p">${i+1}</span>${av(p,34)}<div class="n">${esc(p.name)}${p.id===ME?' (tu)':''}<small>${p.s.cups} · ${p.s.water} · ${p.s.bingo} · ${p.s.extra}</small></div><span class="s">${p.s.total}</span></div>`).join('')}</div>
  ${L.length?`<div class="awards"><div class="aw2"><div class="e">🧽</div><div class="l">Esponja do dia</div><div class="v">${esc(by(p=>p.s.cups).name)}</div></div><div class="aw2"><div class="e">💧</div><div class="l">Camelo hidratado</div><div class="v">${esc(by(p=>p.water||0).name)}</div></div><div class="aw2"><div class="e">🎯</div><div class="l">Rei do bingo</div><div class="v">${esc(by(p=>p.s.cells).name)}</div></div><div class="aw2"><div class="e">🃏</div><div class="l">Desafiador</div><div class="v">${esc(by(p=>p.s.extra).name)}</div></div></div>`:''}
  ${gallery()}
  <button class="btn gold full" onclick="endAsk()">🏁 Terminar a rota</button>
  <div class="card"><div style="font:700 17px Fraunces;margin-bottom:4px">Ao vivo</div><div class="feed">${events.filter(e=>e.msg).slice(0,15).map(e=>`<div><span style="opacity:.6">${new Date(e.t).toTimeString().slice(0,5)}</span> · ${e.msg}${e.pts?` <b style="color:var(--gold)">${e.pts>0?'+':''}${e.pts}</b>`:''}</div>`).join('')||'<div>Ainda nada. Lancem uma carta!</div>'}</div></div>
  </div>`;
}
function rules(){openM(`<div class="hd"><div class="em">📜</div><h3>Como se pontua</h3></div>
  <div class="card" style="background:var(--s2)"><div class="rule"><span>🍷 Cada copo provado</span><b>+1</b></div><div class="rule"><span>💧 Cada água (até ao nº de copos)</span><b>+1</b></div>
  <div class="rule"><span>🎯 Casa do bingo</span><b>+2 a +4</b></div><div class="rule"><span>🎯 Linha completa</span><b>+5 + poder</b></div><div class="rule"><span>🎯 Cartão cheio</span><b>+15</b></div>
  <div class="rule"><span>🃏 Ganhar carta desafio</span><b>+2 a +3</b></div><div class="rule"><span>⚔️ Ganhar duelo a quem te desafiou</span><b>+2</b></div><div class="rule"><span>🗡️ Ser roubado</span><b>−3</b></div></div>
  <p>O ranking geral soma tudo. Regista só o que fizeste, é jogo de honra. 🍷</p><button class="btn gold full" style="margin-top:12px" onclick="closeM()">Percebido</button>`)}

function confetti(n){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*4,d:(Math.random()-.5)*1.5,r:Math.random()*6,s:5+Math.random()*7,col:['#9E1F45','#D9B44A','#F4E9DC','#5AB0E6'][Math.floor(Math.random()*4)]}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=p.d;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
render();Store.init();
</script>
</body>
</html>
